# application.conf
# Главный конфигурационный файл Ktor-сервера WhatsMAX.
# Содержит настройки HTTP, базы данных, CORS и путей для загрузки файлов.

ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
    }
    application {
        modules = [ com.whatsmax.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/whatsmax"
    url = ${?DATABASE_URL}
    driver = "org.postgresql.Driver"
    user = "postgres"
    user = ${?DATABASE_USER}
    # Дефолтный пароль только для локалки. В проде задавать через DATABASE_PASSWORD env.
    password = "08965"
    password = ${?DATABASE_PASSWORD}
    # Увеличен с 10 после фикса N+1 проблем — под параллельную нагрузку чата 10 быстро исчерпывается.
    maxPoolSize = 30
}

upload {
    # Папка для хранения загруженных файлов (legacy fallback, новые файлы идут в MinIO)
    path = "./uploads"
    maxFileSizeMb = 50
}

storage {
    # Конфигурация MinIO (S3-совместимое хранилище). Запускается через docker-compose up -d.
    # endpoint — куда ходит backend (внутри docker-сети это http://minio:9000).
    # publicEndpoint — куда ходит клиент (Android эмулятор видит хост как 10.0.2.2).
    endpoint   = "http://localhost:9000"
    endpoint   = ${?MINIO_ENDPOINT}
    publicEndpoint = ${storage.endpoint}
    publicEndpoint = ${?MINIO_PUBLIC_ENDPOINT}
    accessKey  = "whatsmax_admin"
    accessKey  = ${?MINIO_ACCESS_KEY}
    secretKey  = "whatsmax_secret_change_me"
    secretKey  = ${?MINIO_SECRET_KEY}
    bucket     = "whatsmax-files"
    bucket     = ${?MINIO_BUCKET}
    # TTL для presigned download URL. 24 часа — компромисс между:
    #  - короткий TTL = чаще через redirect, больше cold-fetch'ей бэкенда
    #  - длинный TTL = ссылки на стене Coil-кеша живут дольше, при компрометации труднее отозвать
    presignedTtlSeconds = 86400
}

firebase {
    # Путь к JSON-файлу сервисного аккаунта Firebase
    # Скачать: Firebase Console → Project Settings → Service accounts
    serviceAccountPath = "./firebase-service-account.json"
    serviceAccountPath = ${?FIREBASE_SERVICE_ACCOUNT_PATH}
}

cors {
    # Список разрешённых origin-хостов через запятую. Пустая строка → anyHost (только для локалки).
    # Прод: задавать через CORS_ALLOWED_HOSTS, например "app.whatsmax.com,admin.whatsmax.com".
    allowedHosts = ""
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
}

redis {
    # Если enabled=false — работает single-instance режим (in-memory only).
    # Включить при multi-instance деплое.
    enabled = false
    enabled = ${?REDIS_ENABLED}
    url     = "redis://localhost:6379"
    url     = ${?REDIS_URL}
}
