# docker-compose.yml
# Полный локальный стек WhatsMAX: Postgres + MinIO + Redis + backend.
# Запуск: docker compose up -d --build
#
# Сервисы:
#   postgres    — БД для пользователей/чатов/сообщений
#   minio       — S3-совместимое объектное хранилище (порт 9000 — API, 9001 — Web UI)
#   minio-init  — однократно создаёт bucket "whatsmax-files" и выставляет public download
#   redis       — pub/sub для multi-instance WebSocket (по умолчанию не используется)
#   backend     — Ktor-приложение, порт 8080

services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsmax-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       "whatsmax"
      POSTGRES_USER:     "${DATABASE_USER:-postgres}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-08965}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: whatsmax-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI (http://localhost:9001)
    environment:
      # Дефолты только для dev. В проде задавать через .env или secrets manager.
      MINIO_ROOT_USER:     "${MINIO_ROOT_USER:-whatsmax_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-whatsmax_secret_change_me}"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-09-09T07-53-10Z
    container_name: whatsmax-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     "${MINIO_ROOT_USER:-whatsmax_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-whatsmax_secret_change_me}"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/whatsmax-files;
      mc anonymous set download local/whatsmax-files;
      echo 'Bucket whatsmax-files готов (public read).';
      "

  redis:
    image: redis:7.4-alpine
    container_name: whatsmax-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsmax-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # БД — внутри сети контейнеров идём по имени сервиса.
      DATABASE_URL:      "jdbc:postgresql://postgres:5432/whatsmax"
      DATABASE_USER:     "${DATABASE_USER:-postgres}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:-08965}"
      # MinIO: backend пишет внутри сети (minio:9000),
      # а клиенту отдаём ссылки на публичный endpoint (с хоста / эмулятора).
      MINIO_ENDPOINT:         "http://minio:9000"
      MINIO_PUBLIC_ENDPOINT:  "${MINIO_PUBLIC_ENDPOINT:-http://10.0.2.2:9000}"
      MINIO_ACCESS_KEY:       "${MINIO_ROOT_USER:-whatsmax_admin}"
      MINIO_SECRET_KEY:       "${MINIO_ROOT_PASSWORD:-whatsmax_secret_change_me}"
      MINIO_BUCKET:           "whatsmax-files"
      # Firebase
      FIREBASE_SERVICE_ACCOUNT_PATH: "/app/firebase-service-account.json"
      # Redis опционально (multi-instance). По умолчанию выключен.
      REDIS_ENABLED: "false"
      REDIS_URL:     "redis://redis:6379"
      # CORS пустой = anyHost (только dev).
      CORS_ALLOWED_HOSTS: "${CORS_ALLOWED_HOSTS:-}"
    volumes:
      # Сервисный аккаунт Firebase прокидываем read-only, не запекая в образ.
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      # Legacy fallback для локального диска (новые файлы идут в MinIO).
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
  postgres_data:
